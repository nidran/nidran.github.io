<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
  <title>The GRU cell: one memory line managed by reset and update gates</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f6fd0"/></marker>
  </defs>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#1a1a1a">Inside one GRU cell</text>

  <!-- single memory line -->
  <line x1="20" y1="80" x2="800" y2="80" stroke="#2f6fd0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#2f6fd0">hidden state  h  (the ONE memory line — no separate cell state)</text>
  <text x="22" y="100" font-size="12" fill="#5a5a5a">h_prev</text>
  <text x="772" y="100" font-size="12" fill="#5a5a5a">h_new</text>

  <!-- blend box on the line -->
  <rect x="508" y="58" width="184" height="44" rx="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="600" y="76" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1a1a1a">BLEND</text>
  <text x="600" y="92" text-anchor="middle" font-size="11" fill="#2f6fd0">h = (1−z)·h~ + z·h_prev</text>

  <!-- reset multiply node -->
  <circle cx="230" cy="150" r="17" fill="#ffffff" stroke="#5a5a5a" stroke-width="2"/>
  <text x="230" y="156" text-anchor="middle" font-size="18" fill="#5a5a5a">×</text>
  <path d="M150,82 C190,110 215,120 228,133" fill="none" stroke="#2f6fd0" stroke-width="1.3" marker-end="url(#ab)"/>
  <text x="120" y="128" font-size="10" fill="#5a5a5a">tap past</text>

  <!-- reset gate box -->
  <rect x="178" y="230" width="104" height="64" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="230" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RESET gate</text>
  <text x="230" y="270" text-anchor="middle" font-size="10.5" fill="#5a5a5a">sigmoid → 0..1</text>
  <text x="230" y="284" text-anchor="middle" font-size="10.5" fill="#5a5a5a">"how much past?"</text>
  <line x1="230" y1="230" x2="230" y2="169" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- candidate box -->
  <rect x="356" y="230" width="118" height="64" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="415" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">CANDIDATE</text>
  <text x="415" y="270" text-anchor="middle" font-size="10.5" fill="#5a5a5a">h~ = tanh(...)</text>
  <text x="415" y="284" text-anchor="middle" font-size="10.5" fill="#5a5a5a">"draft new memory"</text>
  <path d="M247,150 C320,150 350,180 380,228" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M450,230 C480,170 520,130 545,104" fill="none" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="470" y="150" font-size="10" fill="#5a5a5a">weight (1−z)</text>

  <!-- update gate box -->
  <rect x="606" y="230" width="148" height="64" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="680" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">UPDATE gate  z</text>
  <text x="680" y="270" text-anchor="middle" font-size="10.5" fill="#5a5a5a">sigmoid → 0..1</text>
  <text x="680" y="284" text-anchor="middle" font-size="10.5" fill="#5a5a5a">"keep old vs take new"</text>
  <line x1="660" y1="230" x2="630" y2="104" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- inputs -->
  <rect x="60" y="420" width="200" height="44" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="160" y="447" text-anchor="middle" font-size="12.5" fill="#1a1a1a">inputs:  x (new word)  +  h_prev</text>
  <g stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#a)" stroke-dasharray="3 3">
    <path d="M160,420 C160,360 230,330 230,296"/>
    <path d="M210,420 C300,360 415,330 415,296"/>
    <path d="M250,420 C440,350 680,330 680,296"/>
  </g>
  <text x="270" y="412" font-size="10.5" fill="#5a5a5a">every gate sees x and h_prev</text>

  <text x="410" y="494" text-anchor="middle" font-size="12.5" fill="#1a1a1a">One line, two gates. The update gate forgets and writes with a SINGLE dial: keep z, take (1−z).</text>
  <text x="410" y="513" text-anchor="middle" font-size="11.5" fill="#2f6fd0">Holding z near 1 keeps old memory — that additive path is what saves the gradient.</text>
</svg>

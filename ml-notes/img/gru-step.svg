<svg viewBox="0 0 820 230" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="820" height="230" fill="#ffffff"/>
  <title>One GRU step as a sequence</title>
  <defs>
    <marker id="s" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/></marker>
  </defs>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#1a1a1a">One step, in order</text>

  <rect x="30" y="60" width="150" height="70" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="105" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">1. See inputs</text>
  <text x="105" y="108" text-anchor="middle" font-size="11" fill="#5a5a5a">x  and  h_prev</text>

  <rect x="210" y="60" width="160" height="70" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="290" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">2. RESET gate</text>
  <text x="290" y="103" text-anchor="middle" font-size="10.5" fill="#5a5a5a">how much past to</text>
  <text x="290" y="117" text-anchor="middle" font-size="10.5" fill="#5a5a5a">use for the draft?</text>

  <rect x="400" y="60" width="160" height="70" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="480" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">3. CANDIDATE</text>
  <text x="480" y="103" text-anchor="middle" font-size="10.5" fill="#5a5a5a">draft h~ from x +</text>
  <text x="480" y="117" text-anchor="middle" font-size="10.5" fill="#5a5a5a">reset-filtered past</text>

  <rect x="590" y="60" width="160" height="70" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="670" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">4. UPDATE gate</text>
  <text x="670" y="103" text-anchor="middle" font-size="10.5" fill="#5a5a5a">keep old memory</text>
  <text x="670" y="117" text-anchor="middle" font-size="10.5" fill="#5a5a5a">or take candidate?</text>

  <rect x="300" y="160" width="220" height="48" rx="9" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="410" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">5. OUTPUT  h_t</text>
  <text x="410" y="198" text-anchor="middle" font-size="10.5" fill="#2f6fd0">blend of old memory + candidate</text>

  <g stroke="#5a5a5a" stroke-width="1.5" fill="none" marker-end="url(#s)">
    <line x1="180" y1="95" x2="208" y2="95"/>
    <line x1="370" y1="95" x2="398" y2="95"/>
    <line x1="560" y1="95" x2="588" y2="95"/>
    <path d="M670,130 C670,150 520,160 522,178"/>
  </g>
</svg>

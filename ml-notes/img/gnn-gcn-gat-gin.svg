<svg viewBox="0 0 680 372" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="680" height="372" fill="#ffffff"/>
  <title>How GCN, GAT, and GIN weight neighbors differently</title>

  <rect x="40" y="44" width="190" height="252" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="245" y="44" width="190" height="252" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="450" y="44" width="190" height="252" rx="8" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="4 4"/>

  <text x="56" y="34" font-size="14" font-weight="700" fill="#1a1a1a">GCN</text><text x="92" y="34" font-size="12" fill="#5a5a5a">fixed by degree</text>
  <text x="261" y="34" font-size="14" font-weight="700" fill="#1a1a1a">GAT</text><text x="297" y="34" font-size="12" fill="#5a5a5a">learned attention</text>
  <text x="466" y="34" font-size="14" font-weight="700" fill="#1a1a1a">GIN</text><text x="502" y="34" font-size="12" fill="#5a5a5a">plain sum</text>

  <line x1="135" y1="180" x2="95" y2="108" stroke="#888780" stroke-width="1"/>
  <line x1="135" y1="180" x2="180" y2="108" stroke="#888780" stroke-width="1"/>
  <text x="96" y="150" font-size="12" fill="#5a5a5a">0.41</text><text x="158" y="150" font-size="12" fill="#5a5a5a">0.41</text>
  <circle cx="95" cy="100" r="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="95" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">B</text>
  <circle cx="180" cy="100" r="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="180" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">C</text>
  <circle cx="135" cy="188" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="135" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">A</text>
  <rect x="52" y="222" width="166" height="64" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="62" y="242" font-size="12" fill="#2C2C2A">weight = 1 / √(d_A·d_u)</text><text x="62" y="260" font-size="12" fill="#5F5E5A">same for every neighbor</text><text x="62" y="278" font-size="12" fill="#5F5E5A">ignores what's inside</text>

  <line x1="340" y1="180" x2="300" y2="108" stroke="#888780" stroke-width="1"/>
  <line x1="340" y1="180" x2="385" y2="108" stroke="#888780" stroke-width="1"/>
  <text x="299" y="150" font-size="12" fill="#5a5a5a">0.70</text><text x="365" y="150" font-size="12" fill="#5a5a5a">0.30</text>
  <circle cx="300" cy="100" r="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="300" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">B</text>
  <circle cx="385" cy="100" r="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="385" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">C</text>
  <circle cx="340" cy="188" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="340" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">A</text>
  <rect x="257" y="222" width="166" height="64" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="267" y="242" font-size="12" fill="#2C2C2A">weight = α (learned)</text><text x="267" y="260" font-size="12" fill="#5F5E5A">depends on h_A vs h_u</text><text x="267" y="278" font-size="12" fill="#5F5E5A">important neighbor wins</text>

  <line x1="545" y1="180" x2="505" y2="108" stroke="#888780" stroke-width="1"/>
  <line x1="545" y1="180" x2="590" y2="108" stroke="#888780" stroke-width="1"/>
  <text x="506" y="150" font-size="12" fill="#5a5a5a">1</text><text x="575" y="150" font-size="12" fill="#5a5a5a">1</text>
  <circle cx="505" cy="100" r="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="505" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">B</text>
  <circle cx="590" cy="100" r="18" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="590" y="105" text-anchor="middle" font-size="13" font-weight="700" fill="#042C53">C</text>
  <circle cx="545" cy="188" r="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="545" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#26215C">A</text>
  <rect x="462" y="222" width="166" height="64" rx="6" fill="#F1EFE8" stroke="#5F5E5A"/><text x="472" y="242" font-size="12" fill="#2C2C2A">weight = 1, self = 1+ε</text><text x="472" y="260" font-size="12" fill="#5F5E5A">sum keeps the counts</text><text x="472" y="278" font-size="12" fill="#5F5E5A">most expressive (WL test)</text>

  <rect x="40" y="312" width="600" height="48" rx="8" fill="#FAFAF7" stroke="#d8d6cc"/>
  <text x="56" y="332" font-size="12" fill="#5a5a5a">same graph, same neighbors B and C — only the edge weights differ across models</text>
  <text x="56" y="350" font-size="12" fill="#5a5a5a">cost rises left to right: GCN cheapest, GAT pays for attention, GIN's MLPs cost most</text>
</svg>

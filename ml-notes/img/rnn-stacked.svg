<svg viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>
  <title>A stacked vanilla RNN unrolled over time: one hidden state per layer flows sideways, output flows up</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f6fd0"/></marker>
  </defs>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#1a1a1a">Stacked RNN, unrolled over time</text>

  <text x="200" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#5a5a5a">t − 1</text>
  <text x="410" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#5a5a5a">t</text>
  <text x="620" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#5a5a5a">t + 1</text>

  <text x="36" y="135" font-size="12" font-weight="700" fill="#1a1a1a">Layer 2</text>
  <text x="36" y="285" font-size="12" font-weight="700" fill="#1a1a1a">Layer 1</text>

  <!-- Layer 2 cells -->
  <g>
    <rect x="140" y="100" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#5a5a5a"/>
    <text x="200" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RNN</text>
    <rect x="350" y="100" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#5a5a5a"/>
    <text x="410" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RNN</text>
    <rect x="560" y="100" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#5a5a5a"/>
    <text x="620" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RNN</text>
  </g>
  <!-- Layer 1 cells -->
  <g>
    <rect x="140" y="250" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#5a5a5a"/>
    <text x="200" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RNN</text>
    <rect x="350" y="250" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#5a5a5a"/>
    <text x="410" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RNN</text>
    <rect x="560" y="250" width="120" height="70" rx="10" fill="#f3f4f6" stroke="#5a5a5a"/>
    <text x="620" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">RNN</text>
  </g>

  <!-- horizontal hidden-state flow -->
  <g stroke="#2f6fd0" stroke-width="2.2" fill="none" marker-end="url(#ab)">
    <line x1="260" y1="135" x2="350" y2="135"/>
    <line x1="470" y1="135" x2="560" y2="135"/>
    <line x1="260" y1="285" x2="350" y2="285"/>
    <line x1="470" y1="285" x2="560" y2="285"/>
  </g>
  <g stroke="#2f6fd0" stroke-width="2.2" fill="none" marker-end="url(#ab)" stroke-dasharray="4 4">
    <line x1="95" y1="135" x2="140" y2="135"/>
    <line x1="680" y1="135" x2="725" y2="135"/>
    <line x1="95" y1="285" x2="140" y2="285"/>
    <line x1="680" y1="285" x2="725" y2="285"/>
  </g>
  <text x="305" y="126" text-anchor="middle" font-size="10" fill="#2f6fd0">h (layer 2)</text>
  <text x="305" y="276" text-anchor="middle" font-size="10" fill="#2f6fd0">h (layer 1)</text>

  <!-- vertical -->
  <g stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="250" x2="200" y2="170"/>
    <line x1="410" y1="250" x2="410" y2="170"/>
    <line x1="620" y1="250" x2="620" y2="170"/>
  </g>
  <text x="410" y="218" text-anchor="middle" font-size="10" fill="#5a5a5a">layer-1 output = layer-2 input</text>

  <!-- inputs -->
  <g stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="395" x2="200" y2="320"/>
    <line x1="410" y1="395" x2="410" y2="320"/>
    <line x1="620" y1="395" x2="620" y2="320"/>
  </g>
  <text x="200" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">x_{t−1}</text>
  <text x="410" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">x_t</text>
  <text x="620" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">x_{t+1}</text>

  <!-- outputs -->
  <g stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="100" x2="200" y2="84"/>
    <line x1="410" y1="100" x2="410" y2="84"/>
    <line x1="620" y1="100" x2="620" y2="84"/>
  </g>

  <text x="410" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">Same wiring as GRU/LSTM stacks: one memory line per layer goes sideways, each layer's output feeds up.</text>
  <text x="410" y="465" text-anchor="middle" font-size="11" fill="#2f6fd0">But the cell has no gates — the sideways memory fades fast, so deep RNN stacks still can't hold long-range info.</text>
</svg>

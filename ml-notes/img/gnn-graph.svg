<svg viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="680" height="390" fill="#ffffff"/>
  <title>Graph structure with node feature vectors</title>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#888780"/></marker></defs>

  <line x1="200" y1="90" x2="110" y2="190" stroke="#888780" stroke-width="1"/>
  <line x1="200" y1="90" x2="300" y2="190" stroke="#888780" stroke-width="1"/>
  <line x1="110" y1="190" x2="300" y2="190" stroke="#888780" stroke-width="1"/>
  <line x1="110" y1="190" x2="150" y2="300" stroke="#888780" stroke-width="1"/>
  <line x1="300" y1="190" x2="270" y2="300" stroke="#888780" stroke-width="1"/>
  <line x1="150" y1="300" x2="270" y2="300" stroke="#888780" stroke-width="1"/>

  <circle cx="200" cy="90" r="24" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.5"/><text x="200" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#26215C">A</text>
  <circle cx="110" cy="190" r="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="110" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">B</text>
  <circle cx="300" cy="190" r="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="300" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">C</text>
  <circle cx="150" cy="300" r="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="150" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">D</text>
  <circle cx="270" cy="300" r="24" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="270" y="306" text-anchor="middle" font-size="15" font-weight="700" fill="#042C53">E</text>

  <line x1="224" y1="90" x2="448" y2="90" stroke="#b8b6ab" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="470" y="64" font-size="14" font-weight="700" fill="#1a1a1a">node A input features</text>
  <text x="470" y="80" font-size="12" fill="#5a5a5a">vector x_A, one number per feature</text>

  <rect x="470" y="92" width="150" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="480" y="109" font-size="12" fill="#26215C">f1   credit score</text>
  <rect x="470" y="120" width="150" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="480" y="137" font-size="12" fill="#26215C">f2   account age</text>
  <rect x="470" y="148" width="150" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="480" y="165" font-size="12" fill="#26215C">f3   txn volume</text>
  <rect x="470" y="176" width="150" height="26" rx="4" fill="#EEEDFE" stroke="#534AB7"/><text x="480" y="193" font-size="12" fill="#26215C">f4   ...</text>

  <rect x="40" y="332" width="600" height="44" rx="8" fill="#FAFAF7" stroke="#d8d6cc"/>
  <text x="56" y="352" font-size="12" fill="#5a5a5a">nodes = entities (users, atoms, pages)   ·   edges = relations between them</text>
  <text x="56" y="368" font-size="12" fill="#5a5a5a">every node carries its own feature vector x; the model learns from features + wiring</text>
</svg>

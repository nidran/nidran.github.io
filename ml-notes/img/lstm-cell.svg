<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
  <title>The LSTM cell: a memory belt managed by forget, input, and output gates</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f6fd0"/></marker>
  </defs>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#1a1a1a">Inside one LSTM cell</text>
  <line x1="20" y1="80" x2="800" y2="80" stroke="#2f6fd0" stroke-width="3" marker-end="url(#ab)"/>
  <text x="40" y="68" font-size="13" font-weight="700" fill="#2f6fd0">cell state  c (the memory belt — long-term memory)</text>
  <text x="22" y="100" font-size="12" fill="#5a5a5a">c_prev</text>
  <text x="772" y="100" font-size="12" fill="#5a5a5a">c_new</text>
  <circle cx="230" cy="80" r="17" fill="#ffffff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="230" y="86" text-anchor="middle" font-size="18" fill="#2f6fd0">×</text>
  <rect x="178" y="230" width="104" height="64" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="230" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">FORGET gate</text>
  <text x="230" y="274" text-anchor="middle" font-size="10.5" fill="#5a5a5a">sigmoid → 0..1</text>
  <text x="230" y="288" text-anchor="middle" font-size="10.5" fill="#5a5a5a">"what to erase"</text>
  <line x1="230" y1="230" x2="230" y2="99" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="470" cy="80" r="17" fill="#ffffff" stroke="#2f6fd0" stroke-width="2"/>
  <text x="470" y="86" text-anchor="middle" font-size="18" fill="#2f6fd0">+</text>
  <rect x="396" y="230" width="148" height="64" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="470" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">INPUT gate</text>
  <text x="470" y="270" text-anchor="middle" font-size="10.5" fill="#5a5a5a">sigmoid (how much) ×</text>
  <text x="470" y="284" text-anchor="middle" font-size="10.5" fill="#5a5a5a">tanh (candidate "what to add")</text>
  <line x1="470" y1="230" x2="470" y2="99" stroke="#5a5a5a" stroke-width="1.5" marker-end="url(#a)"/>
  <circle cx="680" cy="80" r="17" fill="#ffffff" stroke="#5a5a5a" stroke-width="2"/>
  <text x="680" y="86" text-anchor="middle" font-size="15" fill="#5a5a5a">→</text>
  <rect x="606" y="230" width="148" height="64" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="680" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">OUTPUT gate</text>
  <text x="680" y="270" text-anchor="middle" font-size="10.5" fill="#5a5a5a">sigmoid × tanh(c)</text>
  <text x="680" y="284" text-anchor="middle" font-size="10.5" fill="#5a5a5a">"what to read out"</text>
  <line x1="680" y1="80" x2="680" y2="160" stroke="#2f6fd0" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="680" y1="178" x2="680" y2="228" stroke="#5a5a5a" stroke-width="1.5"/>
  <line x1="680" y1="294" x2="680" y2="350" stroke="#5a5a5a" stroke-width="2" marker-end="url(#a)"/>
  <rect x="612" y="352" width="136" height="42" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="680" y="378" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">hidden state  h (output)</text>
  <rect x="60" y="420" width="200" height="44" rx="9" fill="#f3f4f6" stroke="#5a5a5a"/>
  <text x="160" y="447" text-anchor="middle" font-size="12.5" fill="#1a1a1a">inputs:  x (new word)  +  h_prev</text>
  <g stroke="#5a5a5a" stroke-width="1.3" fill="none" marker-end="url(#a)" stroke-dasharray="3 3">
    <path d="M160,420 C160,360 230,340 230,296"/>
    <path d="M200,420 C300,360 470,340 470,296"/>
    <path d="M240,420 C420,350 680,340 680,296"/>
  </g>
  <text x="270" y="412" font-size="10.5" fill="#5a5a5a">every gate sees x and h_prev</text>
  <text x="410" y="494" text-anchor="middle" font-size="12.5" fill="#1a1a1a">Belt is mostly KEEP (×) and ADD (+), not overwrite — so memory + gradient survive long gaps.</text>
  <text x="410" y="513" text-anchor="middle" font-size="11.5" fill="#2f6fd0">GRU = same idea, merged into ONE line with just 2 gates (update + reset).</text>
</svg>

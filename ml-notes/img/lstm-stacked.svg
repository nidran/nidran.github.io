<svg viewBox="0 0 820 490" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <rect x="0" y="0" width="820" height="490" fill="#ffffff"/>
  <title>A stacked LSTM unrolled over time: each layer carries cell state c and hidden state h sideways, only h flows up</title>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5a5a5a"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f6fd0"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#1f9d6b"/></marker>
  </defs>
  <text x="40" y="30" font-size="16" font-weight="700" fill="#1a1a1a">Stacked LSTM, unrolled over time</text>

  <text x="200" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#5a5a5a">t − 1</text>
  <text x="410" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#5a5a5a">t</text>
  <text x="620" y="70" text-anchor="middle" font-size="12" font-weight="700" fill="#5a5a5a">t + 1</text>

  <text x="36" y="140" font-size="12" font-weight="700" fill="#1a1a1a">Layer 2</text>
  <text x="36" y="295" font-size="12" font-weight="700" fill="#1a1a1a">Layer 1</text>

  <!-- Layer 2 cells -->
  <g>
    <rect x="140" y="105" width="120" height="80" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
    <text x="200" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LSTM</text>
    <rect x="350" y="105" width="120" height="80" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
    <text x="410" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LSTM</text>
    <rect x="560" y="105" width="120" height="80" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
    <text x="620" y="150" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LSTM</text>
  </g>
  <!-- Layer 1 cells -->
  <g>
    <rect x="140" y="260" width="120" height="80" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
    <text x="200" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LSTM</text>
    <rect x="350" y="260" width="120" height="80" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
    <text x="410" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LSTM</text>
    <rect x="560" y="260" width="120" height="80" rx="10" fill="#eef4ff" stroke="#2f6fd0" stroke-width="2"/>
    <text x="620" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">LSTM</text>
  </g>

  <!-- Layer 2: two horizontal lines (c on top, h below) -->
  <g stroke="#1f9d6b" stroke-width="2.2" fill="none" marker-end="url(#ag)">
    <line x1="260" y1="125" x2="350" y2="125"/>
    <line x1="470" y1="125" x2="560" y2="125"/>
  </g>
  <g stroke="#2f6fd0" stroke-width="2.2" fill="none" marker-end="url(#ab)">
    <line x1="260" y1="165" x2="350" y2="165"/>
    <line x1="470" y1="165" x2="560" y2="165"/>
  </g>
  <!-- Layer 1: two horizontal lines -->
  <g stroke="#1f9d6b" stroke-width="2.2" fill="none" marker-end="url(#ag)">
    <line x1="260" y1="280" x2="350" y2="280"/>
    <line x1="470" y1="280" x2="560" y2="280"/>
  </g>
  <g stroke="#2f6fd0" stroke-width="2.2" fill="none" marker-end="url(#ab)">
    <line x1="260" y1="320" x2="350" y2="320"/>
    <line x1="470" y1="320" x2="560" y2="320"/>
  </g>
  <!-- dashed continuations -->
  <g stroke="#1f9d6b" stroke-width="2.2" fill="none" marker-end="url(#ag)" stroke-dasharray="4 4">
    <line x1="95" y1="125" x2="140" y2="125"/>
    <line x1="680" y1="125" x2="725" y2="125"/>
    <line x1="95" y1="280" x2="140" y2="280"/>
    <line x1="680" y1="280" x2="725" y2="280"/>
  </g>
  <g stroke="#2f6fd0" stroke-width="2.2" fill="none" marker-end="url(#ab)" stroke-dasharray="4 4">
    <line x1="95" y1="165" x2="140" y2="165"/>
    <line x1="680" y1="165" x2="725" y2="165"/>
    <line x1="95" y1="320" x2="140" y2="320"/>
    <line x1="680" y1="320" x2="725" y2="320"/>
  </g>
  <text x="305" y="118" text-anchor="middle" font-size="10" fill="#1f9d6b">c (cell state)</text>
  <text x="305" y="158" text-anchor="middle" font-size="10" fill="#2f6fd0">h (hidden)</text>

  <!-- vertical: only h goes up -->
  <g stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="260" x2="200" y2="185"/>
    <line x1="410" y1="260" x2="410" y2="185"/>
    <line x1="620" y1="260" x2="620" y2="185"/>
  </g>
  <text x="410" y="228" text-anchor="middle" font-size="10" fill="#5a5a5a">only h goes up (c stays in its layer)</text>

  <!-- inputs -->
  <g stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="415" x2="200" y2="340"/>
    <line x1="410" y1="415" x2="410" y2="340"/>
    <line x1="620" y1="415" x2="620" y2="340"/>
  </g>
  <text x="200" y="435" text-anchor="middle" font-size="12" fill="#1a1a1a">x_{t−1}</text>
  <text x="410" y="435" text-anchor="middle" font-size="12" fill="#1a1a1a">x_t</text>
  <text x="620" y="435" text-anchor="middle" font-size="12" fill="#1a1a1a">x_{t+1}</text>

  <!-- outputs -->
  <g stroke="#5a5a5a" stroke-width="1.8" fill="none" marker-end="url(#a)">
    <line x1="200" y1="105" x2="200" y2="89"/>
    <line x1="410" y1="105" x2="410" y2="89"/>
    <line x1="620" y1="105" x2="620" y2="89"/>
  </g>

  <text x="410" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">Each layer carries TWO lines across time: cell state c (green) and hidden state h (blue).</text>
  <text x="410" y="483" text-anchor="middle" font-size="11" fill="#2f6fd0">Only h is passed upward to the next layer — the c belt never leaves the layer it lives in.</text>
</svg>

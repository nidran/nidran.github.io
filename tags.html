<style>
  .archive-tags { display: flex; flex-wrap: wrap; gap: .5em; margin: 1.2em 0 2em; }
  .archive-tags .tag-item {
    display: inline-block; padding: .25em .7em; border-radius: 999px;
    border: 1px solid currentColor; font-size: .85em; text-decoration: none;
    opacity: .85; line-height: 1.4;
  }
  .archive-tags .tag-item:hover { opacity: 1; text-decoration: none; }
  .skills-page h2 { margin-top: 1.6em; text-transform: uppercase; font-size: 1.1em; opacity: .75; letter-spacing: .04em; }
</style>

<div class="skills-page">
<div class="archive-tags">
  <a class="tag-item" href="#">all</a>
  {%- for tag in site.tags -%} 
    {% capture name %}{{ tag | first }}{% endcapture %}
    <a class="tag-item" href="#{{name}}">{{ name }}</a> 
  {%- endfor -%}
</div>

</div>
